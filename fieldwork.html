    <style>

      .profile-pic {
        width: 300px;
        height: 300px;
        object-fit: cover;
        border-radius: 50%;
        display: block;
        margin: 0 auto;
      }

      header {
        text-align: center;
      }

      .contact-block {
        margin-top: 15px;
      }

      .contact-block p {
        margin: 6px 0;
        font-size: 15px;
      }

      .contact-block i {
        margin-right: 8px;
        color: #555;
      }

      .site-nav {
        margin-top: 18px;
      }

      .site-nav a {
        display: inline-block;
        padding: 6px 10px;
        margin: 3px 2px;
        border: 1px solid #ccc;
        border-radius: 4px;
        text-decoration: none;
      }

      .site-nav a:hover {
        background: #f5f5f5;
      }

      /* FIELDWORK PHOTO GRID */

      .fieldwork-gallery {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 24px 18px;
        margin-top: 25px;
        margin-bottom: 35px;
      }

      .fieldwork-gallery figure {
        margin: 0;
      }

      .fieldwork-gallery img {
        width: 100%;
        height: 220px;
        object-fit: cover;
        display: block;
      }

      .fieldwork-gallery figcaption {
        font-size: 12px;
        line-height: 1.4;
        color: #666;
        margin-top: 7px;
      }

      /* PLACEHOLDER BOXES UNTIL PHOTOS ARE ADDED */

      .photo-placeholder {
        width: 100%;
        height: 220px;
        background: #f3f3f3;
        border: 1px solid #d8d8d8;
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        color: #999;
        font-size: 13px;
        text-align: center;
      }

      /* MOBILE */

      @media screen and (max-width: 600px) {

        .fieldwork-gallery {
          grid-template-columns: 1fr;
        }

        .fieldwork-gallery img,
        .photo-placeholder {
          height: auto;
          min-height: 220px;
        }

      }

    </style>

  </head>
